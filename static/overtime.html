<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overtime Data Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            padding: 0;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }
        select {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        textarea {
            width: 100%;
            height: 400px;
            padding: 10px;
            font-family: monospace; /* Monospace for better alignment visualization */
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            resize: vertical;
            white-space: pre; /* Preserve tabs and newlines */
            overflow-x: auto;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Overtime Report Generator</h1>
    <table>
        <tr>
            <td style="width: 20%; font-weight: bold;">Select Month:</td>
            <td>
                <select id="monthSelect">
                    <option value="" disabled selected>Loading months...</option>
                </select>
            </td>
        </tr>
        <tr>
            <td colspan="2" style="position: relative;">
                <div id="copyOverlay" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); color: white; padding: 5px 10px; border-radius: 4px; display: none; pointer-events: none;">Copied!</div>
                <textarea id="resultArea" placeholder="Result will appear here... Select a month to start. Click to Copy." readonly style="cursor: pointer;"></textarea>
                <div style="text-align: right; font-size: 12px; color: #888; margin-top: 5px;">Click text area to copy content</div>
            </td>
        </tr>
    </table>
</div>

<script>
    // API Endpoints
    const API_MONTH_OPTIONS = 'http://115.28.184.253:25678/webhook/crs-overtime-month-options';
    const API_OVERTIME_DATA = 'http://115.28.184.253:25678/webhook/crs-overtime-data'; // ?month=...
    const API_MEMBER_DETAILS = 'http://115.28.184.253:25678/webhook/crs-member-details';
    const API_SPECIAL_DATES = 'http://115.28.184.253:25678/webhook/overtime-special-dates';

    // State
    let memberDetailsCache = null;
    let specialDatesCache = null;

    // DOM Elements
    const monthSelect = document.getElementById('monthSelect');
    const resultArea = document.getElementById('resultArea');

    // Helper to handle HTTP requests from HTTPS (GitHub Pages)
    async function secureFetch(url) {
        // If on HTTPS but target is HTTP, use a proxy to avoid "Mixed Content" error
        if (window.location.protocol === 'https:' && url.startsWith('http://')) {
            // Using a public CORS/HTTPS proxy as a workaround
            return fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
        }
        return fetch(url);
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', init);

    async function init() {
        try {
            // Fetch static data (Member Details & Special Dates) and Month Options in parallel
            const [monthsRes, membersRes, specialDatesRes] = await Promise.all([
                secureFetch(API_MONTH_OPTIONS),
                secureFetch(API_MEMBER_DETAILS),
                secureFetch(API_SPECIAL_DATES)
            ]);

            const monthsData = await monthsRes.json();
            memberDetailsCache = await membersRes.json();
            specialDatesCache = await specialDatesRes.json();

            populateMonthSelect(monthsData);
        } catch (error) {
            console.error('Initialization error:', error);
            resultArea.value = 'Error initializing application: ' + error.message;
            monthSelect.innerHTML = '<option>Error loading options</option>';
        }
    }

    function populateMonthSelect(data) {
        // Updated for n8n data table format
        monthSelect.innerHTML = '<option value="" disabled selected>Please select a month</option>';
        
        let options = [];
        if (Array.isArray(data)) {
            if (data.length > 0 && data[0].month_options) {
                // Old format: [{"month_options":["2026-1",...]}]
                options = data[0].month_options;
            } else {
                // New format: Array of objects with 'Month' property
                options = data.map(item => item.Month || item.month).filter(Boolean);
            }
        }

        options.forEach(month => {
            const option = document.createElement('option');
            option.value = month;
            option.textContent = month;
            monthSelect.appendChild(option);
        });

        monthSelect.addEventListener('change', handleMonthChange);
    }

    async function handleMonthChange(event) {
        const selectedMonth = event.target.value;
        if (!selectedMonth) return;

        resultArea.value = 'Processing...';

        try {
            const response = await secureFetch(`${API_OVERTIME_DATA}?month=${selectedMonth}`);
            const overtimeData = await response.json();
            
            console.log('Fetched Overtime Data:', overtimeData); // Debug log
            
            if (!overtimeData || (Array.isArray(overtimeData) && overtimeData.length === 0)) {
                resultArea.value = 'No overtime data found for the selected month.';
                return;
            }

            processAndDisplayData(overtimeData);
            
            // If resultArea is still "Processing...", it means aggregation yielded no rows
            if (resultArea.value === 'Processing...') {
                resultArea.value = 'Data found, but could not be processed (check field names).';
            }
        } catch (error) {
            console.error('Error fetching overtime data:', error);
            resultArea.value = 'Error fetching data: ' + error.message;
        }
    }

    function processAndDisplayData(overtimeData) {
        // Map member details for quick lookup
        const memberMap = new Map();
        if (memberDetailsCache) {
            memberDetailsCache.forEach(member => {
                // Handle both spaces and underscores for n8n data table
                const name = member['English Name'] || member['EnglishName'] || member['English_Name'] || member['english_name'];
                if (name) memberMap.set(name, member);
            });
        }

        // Map special dates for quick lookup
        const specialDateMap = new Map();
        if (specialDatesCache) {
            specialDatesCache.forEach(item => {
                const date = item['Special Date'] || item['SpecialDate'] || item['Special_Date'];
                const type = item['Overtime Type'] || item['OvertimeType'] || item['Overtime_Type'];
                if (date && type) specialDateMap.set(date, type);
            });
        }

        // Aggregate data by English Name and Type
        const aggregatedData = new Map();

        if (Array.isArray(overtimeData)) {
            overtimeData.forEach(record => {
                const data = record.json || record;
                const name = data['English Name'] || data['EnglishName'] || data['English_Name'] || data['english_name'];
                if (!name) return;
                
                if (!aggregatedData.has(name)) {
                    // Initialize record
                    const memberInfo = memberMap.get(name) || {};
                    aggregatedData.set(name, {
                        meta: {
                            englishName: name,
                            chineseName: memberInfo['Chinese Name'] || memberInfo['ChineseName'] || memberInfo['Chinese_Name'] || '',
                            title: memberInfo['Title'] || memberInfo['title'] || '',
                            department: memberInfo['Department'] || memberInfo['department'] || ''
                        },
                        types: {
                            'WORKDAY': { dates: [], hours: 0, reasons: new Set() },
                            'WEEKEND': { dates: [], hours: 0, reasons: new Set() },
                            'HOLIDAY': { dates: [], hours: 0, reasons: new Set() }
                        }
                    });
                }

                const agg = aggregatedData.get(name);
                const dateStr = data['Date'] || data['date'] || data['DateValue'];
                const hours = parseFloat(data['Overtime Hours'] || data['OvertimeHours'] || data['Overtime_Hours'] || data['hours']) || 0;
                const reason = data['Overtime Reasons'] || data['OvertimeReasons'] || data['Overtime_Reasons'] || data['reason'];
                
                if (dateStr) {
                    const dateType = getDateType(dateStr, specialDateMap); // 'WORKDAY', 'WEEKEND', or 'HOLIDAY'

                    // Add data to specific type bucket
                    if (agg.types[dateType]) {
                        agg.types[dateType].dates.push(dateStr);
                        agg.types[dateType].hours += hours;
                        if (reason) {
                            agg.types[dateType].reasons.add(reason);
                        }
                    }
                }
            });
        }

        const rows = [];
        aggregatedData.forEach(agg => {
            // Process each type: WORKDAY, WEEKEND, HOLIDAY
            ['WORKDAY', 'WEEKEND', 'HOLIDAY'].forEach(type => {
                const data = agg.types[type];
                if (data.hours > 0) {
                    const row = [
                        agg.meta.englishName,
                        agg.meta.chineseName,
                        agg.meta.title,
                        agg.meta.department,
                        // Work Day Columns
                        type === 'WORKDAY' ? data.dates.join(', ') : '',
                        type === 'WORKDAY' ? data.hours : '',
                        // Weekend Columns
                        type === 'WEEKEND' ? data.dates.join(', ') : '',
                        type === 'WEEKEND' ? data.hours : '',
                        // Holiday Columns
                        type === 'HOLIDAY' ? data.dates.join(', ') : '',
                        type === 'HOLIDAY' ? data.hours : '',
                        // Allowance
                        '', 
                        // Reason
                        Array.from(data.reasons).join('; ')
                    ].join('\t');
                    rows.push(row);
                }
            });
        });

        resultArea.value = rows.join('\n');
    }

    // Click to Copy Logic
    resultArea.addEventListener('click', function() {
        if (!this.value || this.value.startsWith('Processing') || this.value.startsWith('Error')) return;
        
        this.select();
        try {
            // Use Clipboard API if available, fallback to execCommand
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(this.value).then(showCopyFeedback).catch(err => {
                    console.error('Clipboard API failed', err);
                    fallbackCopy(this);
                });
            } else {
                fallbackCopy(this);
            }
        } catch (err) {
            console.error('Copy failed', err);
        }
    });

    function fallbackCopy(textarea) {
        try {
            document.execCommand('copy');
            showCopyFeedback();
        } catch (err) {
            console.error('execCommand failed', err);
        }
    }

    function showCopyFeedback() {
        const overlay = document.getElementById('copyOverlay');
        overlay.style.display = 'block';
        setTimeout(() => {
            overlay.style.display = 'none';
        }, 2000);
    }

    function getDateType(dateStr, specialDateMap) {
        // dateStr format: 1/3/2026 (M/D/YYYY)
        
        // 1. Check Special Dates API
        if (specialDateMap.has(dateStr)) {
            return specialDateMap.get(dateStr); // 'HOLIDAY' or 'WEEKEND'
        }

        // 2. Check Standard Weekend
        const dateParts = dateStr.split('/');
        if (dateParts.length === 3) {
            const month = parseInt(dateParts[0], 10) - 1; // JS months are 0-indexed
            const day = parseInt(dateParts[1], 10);
            const year = parseInt(dateParts[2], 10);
            
            const dateObj = new Date(year, month, day);
            const dayOfWeek = dateObj.getDay(); // 0 is Sunday, 6 is Saturday

            if (dayOfWeek === 0 || dayOfWeek === 6) {
                return 'WEEKEND';
            }
        }

        // 3. Default to Work Day
        return 'WORKDAY';
    }

</script>

</body>
</html>
